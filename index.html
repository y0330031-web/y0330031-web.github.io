const IG=['일반','희귀','영웅','전설'],sellV=i=>({g:i.pw*3,s:Math.max(1,Math.floor(i.pw/15))+i.g,o:Math.max(1,Math.floor(i.pw/25))+i.g}),upC=i=>{const n=(i.up||0)+1,k=n>10?3:1,d=1-Math.min(.5,((S.x&&S.x.rb&&S.x.rb.u)||0)*.01);return{g:Math.floor(80*n*(i.g+1)*k*d),o:Math.max(1,Math.floor(n*(i.g+1)*2*k*d))}},SYR=[1.7,1.41,1.33];
const eqBlock=m=>`<div class="mu" style="margin-top:8px">🎒 장비는 모든 몬스터에 공통 적용돼요 (+${nf(EQP)}) · 🎒 장비 탭에서 바꿔요</div>`;

function eqPick(sl){const cur=S.items.find(i=>i.o&&i.sl==sl),l=S.items.filter(i=>i.sl==sl&&!i.o).sort((a,b)=>b.pw-a.pw),o=document.getElementById('st');o.style.display='flex';
o.innerHTML=`<div class="card" style="width:min(94%,420px);max-height:85%;overflow:auto"><h2 style="margin-top:0">${SL[sl][0]} ${SL[sl][1]} 장착</h2>${cur?`<div class="row" style="margin-bottom:8px"><div class="grow">현재: ${itN(cur)}</div><button class="s" onclick="eqSet(${sl},null)">해제</button></div>`:''}<div style="display:grid;gap:8px">${l.slice(0,40).map(i=>`<button class="s row" style="text-align:left" onclick="eqSet(${sl},${i.id})"><span class="grow">${tagH(i.g)} ${itN(i)}</span><span>장착</span></button>`).join('')||'<p class="mu">장착할 다른 장비가 없어요.</p>'}<button onclick="closeSet()">닫기</button></div></div>`}
function eqSet(sl,iid){S.items.forEach(i=>{if(i.sl==sl)i.o=null});if(iid!=null){const it=S.items.find(i=>i.id==iid);if(it)it.o=1}closeSet();save();render()}
function sellItems(f,label){const l=S.items.filter(i=>!i.o&&f(i));if(!l.length)return toast('팔 장비가 없어요');let g=0,s=0,o=0;l.forEach(i=>{const v=sellV(i);g+=v.g;s+=v.s;o+=v.o});S.st.sold+=l.length;S.gold+=g;S.stone+=s;S.ore+=o;const ids=new Set(l.map(i=>i.id));S.items=S.items.filter(i=>!ids.has(i.id));save();render();toast(`${label} ${l.length}개 판매: 골드 +${nf(g)}, 성장석 +${nf(s)}, 강화석 +${nf(o)}`)}
const sellBag=()=>sellItems(()=>true,'미장착 장비'),sellTo=g=>sellItems(i=>i.g<=g,IG[g]+' 이하 장비'),sellOne=id=>sellItems(i=>i.id==id,'장비');
function upItem(id){const it=S.items.find(i=>i.id==id);if(!it)return;const u=it.up||0;if(u>=20)return toast('최대 강화예요');const c=upC(it);if(S.gold<c.g||S.ore<c.o)return toast('골드 또는 강화석이 부족해요');S.gold-=c.g;S.ore-=c.o;it.bp=it.bp||it.pw;it.pw+=Math.max(2,Math.round(it.bp*.12));it.up=u+1;S.st.up++;save();render();toast('강화 성공! '+itN(it))}
function synth(g,all){const cost=100*(g+1),made=[];for(let k=0;k<(all?99:1);k++){const l=S.items.filter(i=>!i.o&&i.g==g).sort((a,b)=>a.pw-b.pw).slice(0,3);if(l.length<3||S.gold<cost)break;S.gold-=cost;const avg=l.reduce((a,i)=>a+i.pw,0)/3,ids=new Set(l.map(i=>i.id));S.items=S.items.filter(i=>!ids.has(i.id));const it={id:S.nid++,sl:l[rn(3)].sl,g:g+1,pw:ibase(g+1,l.reduce((a,i)=>a+iSc(i.bp||i.pw,g),0)/3,1),o:null};S.items.push(it);made.push(it)}
S.st.syn+=made.length;if(!made.length)return toast(S.items.filter(i=>!i.o&&i.g==g).length<3?'합성하려면 미장착 장비가 3개 필요해요':'골드가 부족해요');save();render();toast(`합성 성공 ×${made.length}: ${itN(made[made.length-1])}`)}
const mvT=()=>`<div class="row" style="margin-top:10px">${[['m','🐾 몬스터'],['e','🎒 장비']].map(([k,n])=>`<button class="s grow" style="${mv==k?'outline:2px solid var(--ac)':''}" onclick="mv='${k}';render()">${n}</button>`).join('')}</div>`;
function eqView(){const un=S.items.filter(i=>!i.o),cnt=g=>un.filter(i=>i.g==g).length,list=[...S.items].sort((a,b)=>(a.o?1:0)-(b.o?1:0)||b.g-a.g||b.pw-a.pw);
return`${mvT()}<h2>장비 (${S.items.length})</h2><div class="mu" style="margin:-4px 0 8px">드롭 등급 확률: 일반 75 · 희귀 20 · 영웅 4.5 · 전설 0.5 (%)</div>

<div class="card"><div class="row"><div class="grow">미장착 ${un.length}개</div><button class="s" onclick="autoEq()">자동 장착</button><button class="s" ${un.length?'':'disabled'} onclick="sellBag()">미장착 전체 판매</button></div>

${list.slice(0,eqN).map(i=>{const v=sellV(i),c=upC(i);return`<div class="card row" style="padding:8px"><div class="grow">${tagH(i.g)} ${itN(i)}<div class="mu">${i.o?'✅ 장착 중':'미장착'}${i.o?'':' · 판매 '+nf(v.g)+'G+'+nf(v.s)+'💎+'+nf(v.o)+'🔨'}</div></div><button class="s" ${(i.up||0)>=20?'disabled':''} onclick="upItem(${i.id})">${(i.up||0)>=20?'MAX':(i.up||0)>=10?'돌파':'강화'}<br><span style="font-size:11px">${(i.up||0)>=20?'':nf(c.g)+'G+'+nf(c.o)+'🔨'}</span></button>${i.o?`<button class="s" onclick="eqSet(${i.sl},null)">해제</button>`:`<button class="s" onclick="eqSet(${i.sl},${i.id})">장착</button><button class="s" onclick="sellOne(${i.id})">판매</button>`}</div>`}).join('')||'<p class="mu">장비가 없어요. 사냥, 던전, 파견에서 얻을 수 있어요.</p>'}
${list.length>eqN?`<button class="s" style="width:100%" onclick="eqN+=30;render()">더 보기 (${list.length-eqN}개 남음)</button>`:''}`}
// 파견
const dsp=(m,t)=>{m.st='disp';S.disp.push({m:m.id,t,t0:now()})};
function sendD(t){const id=document.getElementById('sel').value;if(!id)return toast('보낼 몬스터가 없어요');dsp(mon(id),t);save();render()}
function sendAll(t){const l=S.mons.filter(m=>m.st=='idle');if(!l.length)return;l.forEach(m=>dsp(m,t));save();render();toast(`${l.length}마리 파견 출발!`)}
const dEnd=d=>d.t0+TR[d.t].s*1000;
const dChance=(m,t)=>{const T=TR[t],R=Math.floor(15*Math.pow(T.m,.85)*xDf().hp);return Math.max(.2,Math.min(1,(m?pw(m):10)/R))};
function claim(d,u){S.st.disp++;const m=mon(d.m),T=TR[d.t],ch=dChance(m,d.t),ok=Math.random()<ch,k=ok?xDf().rw:.3,oo=Math.max(1,Math.floor(Math.ceil(T.m/2)*k));S.ore+=oo;u.o+=oo;if(m)m.st='idle';u.ok=ok;u.ch=ch;const p=m?pw(m):10,g=Math.floor(gm((10+(m?m.lv:1)*3)*(1+(m?m.g:0)*.3)*T.m*(1+BN.r/100))*k),s=Math.floor(sm(Math.ceil(T.m*(1+Math.random()*2))*(1+BN.r/100))*k);S.gold+=g;S.stone+=s;u.g+=g;u.s+=s;if(ok){if(Math.random()<T.i)u.i.push(mkItem(p/6+T.q*5));if(Math.random()<T.e*(1+BN.d/100)){giveEgg();u.e++}}}
const dTxt=u=>(u.ok===false?`⚠️ 탐험 실패(성공률 ${Math.round(u.ch*100)}%)! 보상 30%만 — `:'')+`골드 +${nf(u.g)}, 성장석 +${nf(u.s)}, 강화석 +${nf(u.o)}`+(u.i.length?`, 장비 ${u.i.length}개`+(u.i.length==1?' ('+itN(u.i[0])+')':''):'')+(u.e?`, 🥚 알 ${u.e}개!`:'');
function collect(i){const d=S.disp[i];if(!d)return;if(now()<dEnd(d))return recall(i);const u={g:0,s:0,o:0,i:[],e:0};claim(d,u);S.disp.splice(i,1);save();render();toast('파견 완료: '+dTxt(u))}
/* 중간 회수: 경과 시간 비율의 절반만큼 골드·성장석·강화석 (알·장비는 없음) */
function dRv(d){const m=mon(d.m),T=TR[d.t],f=Math.max(0,Math.min(1,(now()-d.t0)/(dEnd(d)-d.t0)));
return{f,g:Math.floor(gm((10+(m?m.lv:1)*3)*(1+(m?m.g:0)*.3)*T.m*(1+BN.r/100))*f*.5),s:Math.floor(Math.ceil(T.m*2)*(1+BN.r/100)*(1+BN.g/100)*f*.5),o:Math.floor(Math.ceil(T.m/2)*f*.5)}}
function dRtxt(v){return'🪙'+nf(v.g)+' 💎'+nf(v.s)+' 🔨'+nf(v.o)}
function dRapply(d,v){S.gold+=v.g;S.stone+=v.s;S.ore+=v.o;const m=mon(d.m);if(m)m.st='idle'}
function recall(i){const d=S.disp[i];if(!d)return;if(now()>=dEnd(d))return collect(i);const m=mon(d.m),v=dRv(d);
if(!confirm((m?nm(m):'몬스터')+'을(를) 중간에 회수할까요?\n\n진행률 '+Math.floor(v.f*100)+'%\n회수 보상: '+dRtxt(v)+'\n(알·장비는 나오지 않아요. 끝까지 기다리면 보상이 훨씬 커요)'))return;
dRapply(d,v);S.disp.splice(i,1);save();render();toast('회수했어요: '+dRtxt(v))}
function recallAll(){const l=S.disp.filter(d=>d&&now()<dEnd(d));if(!l.length)return;const t={g:0,s:0,o:0};l.forEach(d=>{const v=dRv(d);t.g+=v.g;t.s+=v.s;t.o+=v.o});
if(!confirm('진행 중인 파견 '+l.length+'마리를 모두 회수할까요?\n\n회수 보상 합계: '+dRtxt(t)+'\n(알·장비는 나오지 않아요. 끝까지 기다리면 보상이 훨씬 커요)'))return;
S.disp=S.disp.filter(d=>{if(d&&now()<dEnd(d)){dRapply(d,dRv(d));return false}return true});save();render();toast(l.length+'마리 회수: '+dRtxt(t))}

const XTBS=[['고블린 대장','👺'],['석상 거인','🗿'],['불꽃 드래곤','🐉'],['서리 마녀','🧙'],['심해의 괴수','🐙'],['독거미 여왕','🕷️'],['해골 왕','💀'],['폭풍의 매','🦅'],['고대의 골렘','🤖'],['탑의 지배자','👹']];
const xTB=f=>XTBS[(Math.floor(f/10)-1)%XTBS.length];
const _xCh=xCh;xCh=function(){_xCh();const R=xI().run;if(R&&R.f%10==0)R.ch=['k']};
function xBoss(q){const x=xI(),R=x.run,f=R.f,pt=R.ids.map(mon).filter(Boolean);
if(pt.length<R.ids.length){xRunEnd(1);return toast('몬스터가 없어져서 정산했어요')}
const B=xTB(f),e=dEl(f),E=Math.floor(xTE(f)*xDf().hp*2.4*.6),h0=R.hp.slice(),Q=simR(pt,R.hp,e,E,R.buf),ti='🗼 '+f+'층 👹 '+B[0];
if(Q.win){const k=4*xDf().rw*.8,g=Math.floor(gm(300+f*80)*k),s=Math.floor(sm(5+f*1.2)*k),o=Math.floor((2+Math.floor(f/4))*k);R.rw.g+=g;R.rw.s+=s;R.rw.o+=o;if(f%40==0)R.egg=(R.egg||0)+1;x.tbk=(x.tbk||0)+1;giveEgg(null,0,'n');if(f%20==0)giveEgg(e);
let t=B[0]+' 격파!<br>🪙'+nf(g)+' 💎'+nf(s)+' 🔨'+o+'<br>🥚 일반 알 획득!'+(f%20==0?'<br>🔮 '+EL[e][0]+' 속성 알 획득!':'')+(f%40==0?'<br>🌟 고급 알 획득!':'')+'<br>'+itN(mkItem(f*5));if(f%60==0){giveEgg(null,false,'h');t+='<br>💜 영웅 알!'}
R.f++;R.nf=0;xCh();save();if(!q)render();if(!q)battle(pt,f,e,E,1,t,Q.ev,{title:ti,emoji:B[1],big:true,hp0:h0,bx:'<button class="grow" onclick="btClose()">계속</button>'})}
else{const t=xRunEnd(0);if(!q)battle(pt,f,e,E,0,'전멸… '+f+'층 보스 '+B[0]+'에게 쓰러졌어요<br>'+t,Q.ev,{title:ti,emoji:B[1],hp0:h0,bx:'<button class="grow" onclick="btClose()">닫기</button>'})}}
const _xPick=xPick;xPick=function(i,q){const R=xI().run;if(R&&R.ch&&R.ch[i]=='k'){if(busy)return;return xBoss(q)}return _xPick(i,q)};
const _xRS=xRunStart;xRunStart=function(d){const had=!!xI().run;_xRS(d);const x=xI();if(d&&!had&&x.run)x.dcn=(x.dcn||0)+1};
/* --- 🪙 골드 상점: 골드로 강화석·성장석·알 교환 (가격은 사냥터 진행도에 맞춰 올라가고 매일 한도가 있어요) --- */
/* [키, 이름, 기본 가격(🪙), 하루 한도] */
const XGS=[['b','🔨 강화석 ×10',6000,5],['s','💎 성장석 ×20',5000,5],['n','🥚 일반 알',8000,5],['e','🔮 속성 알',30000,2]];
let xgelV='f';
const xGp=e=>Math.floor(e[2]*xS());
function xGbuy(k){const e=XGS.find(a=>a[0]==k);if(!e)return;const c=xSl(),key='g'+k,cost=xGp(e);
if((c[key]||0)>=e[3])return toast('오늘 구매 한도를 모두 썼어요');if(S.gold<cost)return toast('골드가 부족해요');
S.gold-=cost;c[key]=(c[key]||0)+1;if(k=='b')S.ore+=10;else if(k=='s')S.stone+=20;else if(k=='n')giveEgg(null,0,'n');else giveEgg(xgelV,0,'e');
const x=xI();x.gsn=(x.gsn||0)+1;save();render();toast(e[1]+' 구매!')}
function xVk(){const c=xSl();
const rows=XGS.map(e=>{const left=e[3]-(c['g'+e[0]]||0),cost=xGp(e);return`<div class="row" style="margin-top:8px"><div class="grow">${e[1]}${e[0]=='e'?' <span class="mu">(위에서 고른 속성)</span>':''}<div class="mu" style="font-size:12px">오늘 ${left}/${e[3]}</div></div><button class="s" ${left>0&&S.gold>=cost?'':'disabled'} onclick="xGbuy('${e[0]}')">🪙 ${nf(cost)}</button></div>`}).join('');
return`<div class="card"><div>보유 골드 <b>🪙 ${nf(S.gold)}</b></div><div class="mu" style="font-size:12px;margin-top:4px">사냥터 ${S.st.maxS||1}단계 기준 가격이에요 (단계가 오르면 가격도 올라요)</div></div>
<div class="card"><div class="row" style="margin-bottom:4px"><div class="grow mu">🪙 골드 교환 (매일 한도)</div><select onchange="xgelV=this.value;render()" aria-label="속성 선택">${Object.keys(EL).map(k=>`<option value="${k}" ${xgelV==k?'selected':''}>${EL[k][1]} ${EL[k][0]}</option>`).join('')}</select></div>${rows}</div>
<p class="mu">남는 골드로 강화석·성장석·알을 바꿔요. 매일 자정에 한도가 초기화돼요.</p>`}
/* --- 🏆 탑·시련·보스 기록 칭호 (XTI와 XTE는 같은 순서) --- */
XTI.push(
['고층의 등반가','무한의 탑 최고 20층',()=>Math.max((xI().rec||{}).best||0,xI().tw.b||0)>=20],
['하늘 끝에 선 자','무한의 탑 최고 50층',()=>Math.max((xI().rec||{}).best||0,xI().tw.b||0)>=50],
['탑 보스 사냥꾼','탑 보스 10마리 처치',()=>(xI().tbk||0)>=10],
['오늘의 도전자','오늘의 도전 7회 참여',()=>(xI().dcn||0)>=7],
['속성의 탐구자','속성 시련 총 100층 클리어',()=>xTlTot()>=100],
['시련의 대가','한 속성 시련 30층 클리어',()=>Object.values(xI().el||{}).some(v=>v>=30)],
['보스 정복자','주간 보스 보상 20개 수령',()=>(xI().wbn||0)>=20],
['요일의 수호자','요일 속성 보너스 던전 20회 클리어',()=>(xI().dwn||0)>=20],
['큰손','골드 상점 50회 구매',()=>(xI().gsn||0)>=50]);
XTE.push(['f',4],['f',8],['w',5],['l',5],['g',6],['d',6],['f',6],['t',5],['l',4]);

<script>
/* ===== 클라우드(Supabase) 연동 =====
   아래 두 값을 본인 프로젝트 값으로 바꿔 주세요.
   (Supabase > Project Settings > API > Project URL / anon public key)
   anon 키는 공개돼도 안전한 키예요. service_role 키는 절대 넣지 마세요. */
const SB_URL='https://xetdlczkljtwlbrmhnwj.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhldGRsY3prbGp0d2xicm1obndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMjY4MjAsImV4cCI6MjEwNzcwMjgyMH0.Kxs4KyxMU2C8yZ_H5sAL5fCnVvSAWjfotl08-gV8COA';
let sb=null,cu=null,cLast=0,cConf=false,cSyncing=false,lastP=0;
const cOn=()=>!!window.supabase&&!/^YOUR_/.test(SB_URL);
const ce=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cErr=e=>{const m=(e&&e.message)||'';
if(/Invalid login/i.test(m))return'이메일 또는 비밀번호가 맞지 않아요';
if(/already registered|already been registered/i.test(m))return'이미 가입된 이메일이에요';
if(/not confirmed/i.test(m))return'이메일 인증을 먼저 해 주세요';
if(/rate limit/i.test(m))return'잠시 후 다시 시도해 주세요';
if(/valid email|invalid format/i.test(m))return'이메일 형식이 올바르지 않아요';
if(/Failed to fetch|NetworkError/i.test(m))return'네트워크 연결을 확인해 주세요';
return m||'오류가 발생했어요'};

async function cInit(){if(!cOn())return;
sb=window.supabase.createClient(SB_URL,SB_KEY);
const{data}=await sb.auth.getSession();cu=data.session?data.session.user:null;
sb.auth.onAuthStateChange((_e,s)=>{cu=s?s.user:null});
if(cu)cSync()}

/* 클라우드 ↔ 이 기기 비교 후 불러오기/올리기 */
async function cSync(){if(!sb||!cu||cSyncing)return;cSyncing=true;
try{const{data,error}=await sb.from('saves').select('data,updated_ms').eq('user_id',cu.id).maybeSingle();
if(error)throw error;
if(!data){cSyncing=false;return cPush(true)}
const sv=Number(data.updated_ms);cLast=sv;
if(S.cts&&S.cts>=sv){cSyncing=false;cConf=false;return cPush(true)}
const fresh=!S.mons.length&&!S.st.hatch;
const ms=data.data&&data.data.st&&data.data.st.maxS||1;
if(fresh||confirm('클라우드에 저장된 게임이 있어요.\n(최고 '+ms+'단계 · '+new Date(sv).toLocaleString()+')\n\n[확인] 클라우드 게임 불러오기\n[취소] 이 기기 게임 유지 (이후 저장하면 클라우드를 덮어써요)')){cApply(data.data,sv);return}

}catch(e){toast('동기화 실패: '+cErr(e))}finally{cSyncing=false}}

function cApply(d,sv){const b=S.boss;d.boss=b;d.cts=sv;
try{localStorage.setItem(K,JSON.stringify(d))}catch(e){return toast('이 기기에 저장하지 못했어요')}

try{save();const d=JSON.parse(JSON.stringify(S));delete d.boss;delete d.cts;

if(data.reason=='conflict'){cConf=true;cLast=Number(data.server_ms)||cLast;
if(quiet)return toast('다른 기기에 더 최근 저장이 있어요. ⚙️ 설정에서 불러오기를 눌러 확인해 주세요');

S.cts=Number(data.server_ms);cLast=S.cts;lastP=Date.now();save();

</script>
